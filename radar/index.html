<script>
'use strict';
/* ============================================================ core (same logic as the Kotlin core) */
const R=6371000;
const rad=d=>d*Math.PI/180;
const Geo={
  dist(a,b,c,d){const dl=rad(c-a),dn=rad(d-b);const x=Math.sin(dl/2)**2+Math.cos(rad(a))*Math.cos(rad(c))*Math.sin(dn/2)**2;return 2*R*Math.atan2(Math.sqrt(x),Math.sqrt(1-x));},
  bearing(a,b,c,d){const p1=rad(a),p2=rad(c),dl=rad(d-b);const y=Math.sin(dl)*Math.cos(p2),x=Math.cos(p1)*Math.sin(p2)-Math.sin(p1)*Math.cos(p2)*Math.cos(dl);return (Math.atan2(y,x)*180/Math.PI+360)%360;},
  angleDiff(a,b){const d=Math.abs(a-b)%360;return d>180?360-d:d;},
  p2s(pla,plo,ala,alo,bla,blo){const kx=111320*Math.cos(rad(pla)),ky=110540;const ax=(alo-plo)*kx,ay=(ala-pla)*ky,bx=(blo-plo)*kx,by=(bla-pla)*ky;const dx=bx-ax,dy=by-ay,l2=dx*dx+dy*dy;const t=l2===0?0:Math.max(0,Math.min(1,(-ax*dx-ay*dy)/l2));const cx=ax+t*dx,cy=ay+t*dy;return Math.sqrt(cx*cx+cy*cy);},
  dest(lat,lon,brg,m){const d=m/R,b=rad(brg),p1=rad(lat),l1=rad(lon);const p2=Math.asin(Math.sin(p1)*Math.cos(d)+Math.cos(p1)*Math.sin(d)*Math.cos(b));const l2=l1+Math.atan2(Math.sin(b)*Math.sin(d)*Math.cos(p1),Math.cos(d)-Math.sin(p1)*Math.sin(p2));return [p2*180/Math.PI,l2*180/Math.PI];}
};
const TYPES={F:'FIXED',M:'MOBILE',A:'AVG-SPEED',R:'RED-LIGHT'};
function typeOf(s){s=(s||'').trim().toUpperCase();if(['M','MOBILE'].includes(s))return 'M';if(['A','AVG','AVERAGE','SECTION'].includes(s))return 'A';if(['R','RED','RED_LIGHT','REDLIGHT','TRAFFIC_SIGNALS'].includes(s))return 'R';return 'F';}
function parseMaxspeed(s){s=(s||'').toLowerCase().trim();if(!s)return null;const m=s.match(/\d+/);if(!m)return null;const n=+m[0];return s.includes('mph')?Math.round(n*1.609):n;}
function parseOverpassCams(json,src='osm'){const out=[];for(const e of (json.elements||[])){const t=e.tags||{};let lat,lon;if(e.lat!=null){lat=e.lat;lon=e.lon;}else if(e.center){lat=e.center.lat;lon=e.center.lon;}else continue;
  const enf=t.enforcement||'',hw=t.highway||'';let type='F';
  if(enf==='average_speed'||t.speed_camera==='section')type='A';else if(enf==='traffic_signals'||hw==='traffic_signals')type='R';else if((t['camera:type']||'').includes('mobile')||t.speed_camera==='mobile')type='M';
  out.push({id:'osm:'+e.type+':'+e.id,lat,lon,type,limit:parseMaxspeed(t.maxspeed),dir:t.direction&&/^\d+$/.test(t.direction)?parseInt(t.direction):null,src:[src],user:false});}
  return out;}
function splitCsv(line,sep){const o=[];let b='',q=false;for(const ch of line){if(ch==='"')q=!q;else if(ch===sep&&!q){o.push(b);b='';}else b+=ch;}o.push(b);return o;}
function parseCsv(text,src){const lines=text.split(/\r?\n/).filter(l=>l.trim());if(lines.length<2)return[];const sep=(lines[0].split(';').length>lines[0].split(',').length)?';':',';const h=splitCsv(lines[0],sep).map(x=>x.trim().replace(/"/g,'').toLowerCase());
  const col=(...n)=>h.findIndex(x=>n.includes(x));const iLat=col('lat','latitude','y'),iLon=col('lon','lng','long','longitude','x');if(iLat<0||iLon<0)return[];const iT=col('type','camera_type','kind','category'),iL=col('limit','speed','maxspeed','speed_limit','speedlimit'),iD=col('direction','dir','bearing');const out=[];
  for(let n=1;n<lines.length;n++){const f=splitCsv(lines[n],sep).map(x=>x.trim().replace(/"/g,''));if(f.length<=Math.max(iLat,iLon))continue;const lat=parseFloat(f[iLat]),lon=parseFloat(f[iLon]);if(isNaN(lat)||isNaN(lon))continue;
    out.push({id:src+':'+n,lat,lon,type:iT>=0&&f[iT]!=null?typeOf(f[iT]):'F',limit:iL>=0?parseMaxspeed(f[iL]):null,dir:iD>=0&&f[iD]?Math.round(parseFloat(f[iD]))||null:null,src:[src],user:false});}return out;}
function parseGpx(text,src){const out=[];let n=0;const re=/<wpt\b([^>]*)>([\s\S]*?)<\/wpt>/g;let m;while((m=re.exec(text))){const a=m[1];const la=/lat="([-\d.]+)"/.exec(a),lo=/lon="([-\d.]+)"/.exec(a);if(!la||!lo)continue;const body=m[2].toLowerCase();
  const type=body.includes('red')||body.includes('signal')?'R':body.includes('average')||body.includes('section')?'A':body.includes('mobile')?'M':'F';const lm=/\b(\d{2,3})\b/.exec(body);
  out.push({id:src+':'+(n++),lat:+la[1],lon:+lo[1],type,limit:lm?+lm[1]:null,dir:null,src:[src],user:false});}return out;}
function mergeCams(db,inc){const out=db.slice();for(const c of inc){let hit=-1;for(let i=0;i<out.length;i++){const o=out[i];if(Math.abs(o.lat-c.lat)>0.001||Math.abs(o.lon-c.lon)>0.001)continue;if(Geo.dist(o.lat,o.lon,c.lat,c.lon)<=30){hit=i;break;}}
  if(hit<0)out.push(c);else{const o=out[hit];out[hit]={...o,src:[...new Set([...o.src,...c.src])],limit:o.limit??c.limit,dir:o.dir??c.dir,user:o.user||c.user,type:c.user?c.type:o.type};}}return out;}
function dropSource(db,s){return db.map(c=>!c.src.includes(s)?c:(c.src.length>1||c.user)?{...c,src:c.src.filter(x=>x!==s)}:null).filter(Boolean);}
const conf=c=>c.src.length+(c.user?3:0);
/* nearest camera ahead. cone = ±40° of heading; a camera tagged with a direction perpendicular to ours (a cross road) is skipped */
/* which mapped roads a camera sits on (within 40 m), cached per road-data load */
let camWayCache=new Map(),camWayFor=null;const sideMem=new Map();
function camWays(c){if(camWayFor!==roads){camWayFor=roads;camWayCache=new Map();}let l=camWayCache.get(c.id);if(l)return l;l=[];if(roads){for(const w of roads.ways){let bd=41,ba=null,bb=null;for(let k=0;k<w.g.length-1;k++){const a=w.g[k],b=w.g[k+1];if(c.lat<Math.min(a[0],b[0])-0.0005||c.lat>Math.max(a[0],b[0])+0.0005||c.lon<Math.min(a[1],b[1])-0.0005||c.lon>Math.max(a[1],b[1])+0.0005)continue;const d=Geo.p2s(c.lat,c.lon,a[0],a[1],b[0],b[1]);if(d<bd){bd=d;ba=a;bb=b;}}if(ba)l.push({w,d:bd,a:ba,b:bb});}}camWayCache.set(c.id,l);return l;}
const sameRoad=(a,b)=>a.id===b.id||(a.name&&a.name===b.name)||(a.ref&&a.ref===b.ref);
const isLink=w=>!!w.cl&&w.cl.endsWith('_link');const isMajor=w=>/^(motorway|trunk|primary)/.test(w.cl||'');
/* 2 = camera is on the road you are on · 1 = no road data to judge, straight ahead in your lane corridor · 0 = another road */
function onRoad(c,my,hdg,d,b){const lat=Math.abs(d*Math.sin(rad(b-hdg)));const corridor=lat<Math.max(40,d*0.06);
  if(!roads||!roads.ways.length)return corridor?1:0;
  const l=camWays(c);if(!l.length){const cov=roads.off?OFF.cur.has(tileKey(c.lat,c.lon)):(roads.mc&&Geo.dist(c.lat,c.lon,roads.mc[0],roads.mc[1])<1150);return cov?(lat<40?1:0):(corridor?1:0);}
  const al=x=>{const sb=Geo.bearing(x.a[0],x.a[1],x.b[0],x.b[1]);const df=Geo.angleDiff(hdg,sb);return Math.min(df,180-df);};
  if(!my)return lat<30&&l.some(x=>al(x)<25)?1:0;
  {let mine=null,opp=null;for(const x of l){if(!sameRoad(x.w,my))continue;const df=Geo.angleDiff(hdg,Geo.bearing(x.a[0],x.a[1],x.b[0],x.b[1]));if(x.w.ow&&df>120){if(opp==null||x.d<opp)opp=x.d;}else if(!x.w.ow||df<60){if(mine==null||x.d<mine)mine=x.d;}}if(opp!=null&&(mine==null||mine-opp>18))return 0;}   /* far shoulder of the opposite carriageway */
  for(const x of l){if(sameRoad(x.w,my))return 2;if(isLink(my)&&isMajor(x.w)&&corridor)return 2;if(!my.name&&!x.w.name&&!my.ref&&!x.w.ref&&my.cl===x.w.cl&&al(x)<30&&lat<40)return 2;}
  return 0;}
/* which side of the road the camera stands on, from the road geometry (falls back to your GPS track) */
function camSide(c,my,hdg,d,b){const mk=c.id+'|'+Math.round(hdg/90)%4,m=sideMem.get(mk);if(m)return {side:m,known:true};let side=0;
  const l=camWays(c);const x=sideWay(l,my,hdg)||(my&&l.find(q=>sameRoad(q.w,my)))||l[0];
  if(x&&x.d>=2.5){const kx=111320*Math.cos(rad(c.lat)),ky=110540;let vx=(x.b[1]-x.a[1])*kx,vy=(x.b[0]-x.a[0])*ky;const hb=Geo.bearing(x.a[0],x.a[1],x.b[0],x.b[1]);if(Geo.angleDiff(hdg,hb)>90){vx=-vx;vy=-vy;}const ux=(c.lon-x.a[1])*kx,uy=(c.lat-x.a[0])*ky;side=(vx*uy-vy*ux)>0?-1:1;}
  else{const lt=d*Math.sin(rad(b-hdg));if(Math.abs(lt)>6&&d<800)side=lt<0?-1:1;}
  if(side){sideMem.set(mk,side);if(sideMem.size>300)sideMem.clear();return {side,known:true};}return {side:-1,known:false};}
function nearestAhead(db,lat,lon,hdg,maxR=10000,cone=40,my=null){let best=null;for(const c of db){if(Math.abs(c.lat-lat)>0.1||Math.abs(c.lon-lon)>0.1)continue;const d=Geo.dist(lat,lon,c.lat,c.lon);if(d>maxR)continue;const b=Geo.bearing(lat,lon,c.lat,c.lon);
  if(hdg==null){if(d>300)continue;}else{const ad=Geo.angleDiff(hdg,b);if(ad>75)continue;const ok=onRoad(c,my,hdg,d,b);if(!ok||(ok===1&&ad>cone)||(ok===2&&ad>cone&&d<60))continue;if(c.udir!=null&&Geo.angleDiff(hdg,c.udir)>100)continue;if(c.dir!=null&&Geo.angleDiff(hdg,c.dir)>60&&Geo.angleDiff(hdg,(c.dir+180)%360)>60)continue;}
  if(!best||d<best.d)best={cam:c,d,b};}return best;}
const EMIRATES=[['AUH','Abu Dhabi','أبوظبي'],['DXB','Dubai','دبي'],['SHJ','Sharjah','الشارقة'],['AJM','Ajman','عجمان'],['UAQ','Umm Al Quwain','أم القيوين'],['RAK','Ras Al Khaimah','رأس الخيمة'],['FUJ','Fujairah','الفجيرة']];
function emirateOf(name){if(!name)return null;const n=name.toLowerCase();for(const e of EMIRATES){if(n.includes(e[1].toLowerCase())||n.includes(e[2]))return e[0];if(e[0]==='AUH'&&n.includes('abudhabi'))return e[0];if(e[0]==='RAK'&&n.includes('ras al-khaimah'))return e[0];}return null;}
/* when OSM has no maxspeed on a main road, estimate from its class and say so */
const CLASS_DEFAULT={motorway:120,motorway_link:80,trunk:100,trunk_link:60,primary:80,primary_link:60,secondary:60,secondary_link:60,tertiary:60,tertiary_link:40,unclassified:40,residential:40,living_street:25,service:25};
function parseRoads(json,lat,lon){const ways=[];let em=null;for(const e of (json.elements||[])){const t=e.tags||{};if(e.type==='way'){if(!e.geometry)continue;let ms=parseMaxspeed(t.maxspeed),est=false;if(ms==null){ms=CLASS_DEFAULT[t.highway];if(ms==null)continue;est=true;}
  ways.push({id:e.id,ms,est,cl:t.highway,ow:t.oneway==='yes'||t.highway==='motorway'||t.junction==='roundabout',ref:t.ref||null,name:t['name:en']||t.name||null,g:e.geometry.map(p=>[Math.round(p.lat*1e5)/1e5,Math.round(p.lon*1e5)/1e5])});}else if(e.type==='area'){const x=emirateOf(t['name:en'])||emirateOf(t.name);if(x)em=x;}}return {ways,em,clat:lat,clon:lon,v:2,rad:1900};}
function roadsNeedRefresh(r,lat,lon){return (!r||(r.ways.length===0&&!r.em))||r.quick||Geo.dist(lat,lon,r.clat,r.clon)>1500;}
let lastWayId=null;
function matchRoad(r,lat,lon,hdg){if(!r)return null;let best=null,bs=1e18;for(const w of r.ways){if(w.g.length<2)continue;let dm=1e18,sb=0;for(let k=0;k<w.g.length-1;k++){const a=w.g[k],b=w.g[k+1];
  if(lat<Math.min(a[0],b[0])-0.01||lat>Math.max(a[0],b[0])+0.01||lon<Math.min(a[1],b[1])-0.01||lon>Math.max(a[1],b[1])+0.01)continue;
  const d=Geo.p2s(lat,lon,a[0],a[1],b[0],b[1]);if(d<dm){dm=d;sb=Geo.bearing(a[0],a[1],b[0],b[1]);}}if(dm>45)continue;let sc=dm+(w.est?3:0)-(w.id===lastWayId?12:0);if(hdg!=null){const df=Geo.angleDiff(hdg,sb);sc+=(w.ow?df:Math.min(df,180-df))*0.5;}if(sc<bs){bs=sc;best=w;}}lastWayId=best?best.id:null;return best;}
const Q_CAMS=`[out:json][timeout:180];area["ISO3166-1"="AE"]["admin_level"="2"]->.c;(node["highway"="speed_camera"](area.c);node["enforcement"](area.c);relation["type"="enforcement"](area.c);node["highway"="traffic_signals"]["enforcement"](area.c););out body center;`;
const Q_MINOR=(lat,lon)=>`[out:json][timeout:25];way["highway"~"^(motorway_link|trunk_link|primary_link|secondary|secondary_link|tertiary|tertiary_link|unclassified|residential|living_street|service)$"](around:1200,${lat},${lon});out geom;`;
const Q_ROADS=(lat,lon,r=3000)=>`[out:json][timeout:25];(way["highway"]["maxspeed"](around:${r},${lat},${lon});way["highway"~"^(motorway|motorway_link|trunk|trunk_link|primary|secondary)$"](around:${r},${lat},${lon}););out geom;`;
const Q_EM=(lat,lon)=>`[out:json][timeout:20];is_in(${lat},${lon})->.a;area.a["admin_level"="4"]["boundary"="administrative"];out tags;`;
/* offline guess of the emirate (nearest known town) until the map server confirms it */

  if(log.length){h+=`<h2>LOG · last passes</h2><table>`;for(const e of log.slice(0,10)){const dt=new Date(e.t);h+=`<tr><td>${pad2(dt.getHours())}:${pad2(dt.getMinutes())}</td><td>${TYPES[e.type]||e.type}</td><td style="color:${e.over?'#FF3B3B':'#3DF58C'}">${e.spd} km/h</td><td>${e.trig!=null?'at '+e.trig:''}${e.fp?' · FZ':''}</td></tr>`;}h+=`</table>`;}
  h+=`<h2>CAR · drawn on every face</h2><div class="row"><button class="${settings.car!=='A220'?'wht':''}" onclick="setCar('JK')">JEEP WRANGLER JK</button><button class="${settings.car==='A220'?'wht':''}" onclick="setCar('A220')">MERCEDES A 220</button></div>`;
  h+=`<h2>FACES · tap to jump · ● = in the swipe rotation</h2><div class="row"><span style="color:#8a8a8a">ROTATION</span><button onclick="setRot('all')">ALL</button><button onclick="setRot('JK')">JEEP SET</button><button onclick="setRot('A220')">MERC SET</button></div>`;LOOKS.forEach((L,i)=>{h+=`<div class="em"><button class="${settings.look===i?'wht':''}" style="width:230px;text-align:left" onclick="settings.look=${i};saveSettings();lastDraw=0;closeMenu()">${String(i+1).padStart(2,'0')}  ${L.name}${L.car?' · '+L.car:''}${L.wide?' · WIDE':''}${L.obd?' · OBD':''}</button><button onclick="toggleRot(${i})">${rotOn(i)?'●':'○'}</button></div>`;});
  h+=`<p>PER EMIRATE — BUF: km/h over the sign before it flashes (0 = trust no buffer). MIN: the radar never flashes below this speed, whatever the sign says (Sharjah 100).</p>`;
  h+=`<div class="em"><span class="n" style="width:120px"></span><span style="width:112px;color:#8a8a8a;text-align:center">BUF</span><span style="width:112px;color:#8a8a8a;text-align:center">MIN</span></div>`;
  for(const e of EMIRATES){const v=settings.buf[e[0]]||0,fl=settings.floor[e[0]]||0;h+=`<div class="em"><span class="n" style="color:${em===e[0]?'#3DF58C':'#fff'};width:120px">${em===e[0]?'\u25B6 ':'\u00a0\u00a0 '}${e[1]}</span><button onclick="setBuf('${e[0]}',-5)">\u2212</button><span class="v">${v}</span><button onclick="setBuf('${e[0]}',5)">+</button><button onclick="setFloor('${e[0]}',-10)">\u2212</button><span class="v">${fl||'\u2013'}</span><button onclick="setFloor('${e[0]}',10)">+</button></div>`;}
  const mins=Math.round((Date.now()-session.start)/60000);
  h+=`<h2>THIS SESSION</h2><table><tr><td>time</td><td>${mins} min</td><td>dist</td><td>${(session.distM/1000).toFixed(1)} km</td></tr><tr><td>max spd</td><td>${session.maxSpeed}</td><td>max g</td><td>${session.maxG.toFixed(2)}</td></tr><tr><td>cams passed</td><td>${session.passed}</td><td>road</td><td>${state&&state.road?state.road:'--'}</td></tr><tr><td>flashes at</td><td>${state&&state.trig!=null?state.trig+' km/h':'--'}</td><td>sign</td><td>${state&&state.limit!=null?(state.est?'~':'')+state.limit:'--'}</td></tr><tr><td>lifetime</td><td>${life.km.toFixed(0)} km</td><td>passes</td><td>${life.passes} · ${life.drives} drives</td></tr></table>`;
  h+=`<p>Swipe = change face · hold 2 s = mark flash zone · MENU pill = this menu · ${settings.osmPull?'OSM pulled '+new Date(settings.osmPull).toLocaleDateString():'OSM not pulled yet'} · ~ before a limit = estimated from road class · ROADS: ${OFF.idx?'built-in UAE map '+(OFF.v||'')+' · ':''}${roads?roads.ways.length+' loaded'+(roads.mc?' incl. streets':' (main only, streets loading)'):'none yet — needs internet'}${roadBusy||minorBusy?' · downloading…':''}</p>`;menu.innerHTML=h;}
window.nextRot=function(){const o=['auto','0','90','180','270'];settings.rot=o[(o.indexOf(String(settings.rot))+1)%o.length];saveSettings();applyRot();renderMenu();};window.toggleRot=toggleRot;window.setRot=function(k){settings.off=k==="all"?[]:LOOKS.map((L,i)=>L.car&&L.car!==k?i:-1).filter(i=>i>=0);if(!rotOn(settings.look)){settings.look=LOOKS.findIndex((L,i)=>rotOn(i));lastDraw=0;}saveSettings();renderMenu();};window.applyDim=applyDim;window.levelHere=levelHere;window.speak=speak;window.markFlash=markFlash;window.ltrail=ltrail;window.setFloor=function(k,d){settings.floor[k]=Math.max(0,Math.min(150,(settings.floor[k]||0)+d));saveSettings();renderMenu();};window.setBuf=function(k,d){settings.buf[k]=Math.max(0,Math.min(40,(settings.buf[k]||0)+d));saveSettings();renderMenu();};
window.closeMenu=closeMenu;window.markHere=markHere;window.refreshCams=refreshCams;window.beep=beep;window.saveSettings=saveSettings;window.renderMenu=renderMenu;window.settings=settings;window.demoStart=demoStart;window.demoStop=demoStop;window.importText=importText;

/* ============================================================ built-in offline data (ships inside the app): cameras, emirate borders, road tiles with limits */
const CLN=['motorway','motorway_link','trunk','trunk_link','primary','primary_link','secondary','secondary_link','tertiary','tertiary_link','unclassified','residential','living_street','service'];
const OFF={idx:null,full:false,v:null,cell:0.05,tiles:new Map(),pending:new Set(),cur:new Set(),key:null,empoly:null};
function loadScript(src,onerr){try{const e=document.createElement('script');e.src=src;e.onerror=()=>{e.remove();if(onerr)onerr();};e.onload=()=>e.remove();document.head.appendChild(e);}catch(x){if(onerr)onerr();}}
const tileKey=(lat,lon)=>Math.floor(lon/OFF.cell)+'_'+Math.floor(lat/OFF.cell);
window.ROADIDX=function(o){OFF.idx=new Set(o.tiles);OFF.cell=o.cell||0.05;OFF.v=o.v||null;OFF.full=!!o.full;OFF.detail=o.detail||null;};
const inDetail=(lat,lon)=>{const d=OFF.detail;return !d||(lat>d[0]&&lon>d[1]&&lat<d[2]&&lon<d[3]);};
window.RT=function(key,o){try{const ways=[];for(const w of o.w){const c=w[7],g=[];let la=0,lo=0;for(let i=0;i+1<c.length;i+=2){la+=c[i];lo+=c[i+1];g.push([la/1e5,lo/1e5]);}if(g.length>1)ways.push({id:w[0],ms:w[1],est:!!w[2],cl:CLN[w[3]],ow:!!w[4],name:w[5]>=0?o.n[w[5]]:null,ref:w[6]>=0?o.n[w[6]]:null,g});}
  OFF.tiles.set(key,ways);OFF.key=null;if(OFF.tiles.size>12)for(const k of Array.from(OFF.tiles.keys())){if(OFF.tiles.size<=12)break;if(!OFF.cur.has(k)&&k!==key)OFF.tiles.delete(k);}}catch(e){}OFF.pending.delete(key);};
window.EMIRATES_POLY=function(o){OFF.empoly=o;};
window.BUNDLED_CAMS=function(o){try{if(!o||!o.cams||LS.get('bundleV','')===o.v)return;const inc=o.cams.map(c=>({id:'b:'+c[0]+','+c[1],lat:c[0],lon:c[1],type:c[2]||'F',limit:c[3]||null,dir:c[4]!=null&&c[4]>=0?c[4]:null,src:['bundle'],user:false}));cams=mergeCams(dropSource(cams,'bundle'),inc);LS.set('cams',cams);LS.set('bundleV',o.v);}catch(e){}};
/* which emirate a point is in, from the built-in borders */
function emPoly(lat,lon){const P=OFF.empoly;if(!P)return null;for(const k in P){for(const r of P[k]){let ins=false;for(let i=0,j=r.length-2;i<r.length;j=i,i+=2){const xi=r[i],yi=r[i+1],xj=r[j],yj=r[j+1];if((yi>lat)!==(yj>lat)&&lon<(xj-xi)*(lat-yi)/(yj-yi)+xi)ins=!ins;}if(ins)return k;}}return null;}
/* roads around you from the built-in tiles: the tile you are in plus the three nearest neighbours. true = handled offline, no network needed */
function offlineRoads(lat,lon){if(!OFF.idx)return false;const c=OFF.cell,ix=Math.floor(lon/c),iy=Math.floor(lat/c),fx=lon/c-ix,fy=lat/c-iy;const have=[];
  for(const x of [ix,fx<0.5?ix-1:ix+1])for(const y of [iy,fy<0.5?iy-1:iy+1]){const k=x+'_'+y;if(OFF.idx.has(k))have.push(k);}
  if(!have.length){if(OFF.full&&lat>22.4&&lat<26.4&&lon>51.4&&lon<56.6){if(!roads||!roads.off||roads.ways.length){roads={ways:[],em:null,clat:lat,clon:lon,off:true};OFF.cur=new Set();OFF.key='';}return true;}return false;}
  for(const k of have)if(!OFF.tiles.has(k)&&!OFF.pending.has(k)){OFF.pending.add(k);loadScript('data/roads/t_'+k+'.js',()=>OFF.pending.delete(k));}
  const ready=have.filter(k=>OFF.tiles.has(k));const sig=ready.join('|');
  if(sig&&sig!==OFF.key){OFF.key=sig;OFF.cur=new Set(ready);const seen=new Set(),ways=[];for(const k of ready)for(const w of OFF.tiles.get(k))if(!seen.has(w.id)){seen.add(w.id);ways.push(w);}roads={ways,em:null,clat:lat,clon:lon,off:true};}
  return !!sig||OFF.pending.size>0||!!(roads&&roads.off);}

/* ============================================================ go */
applyDim();tick();setInterval(()=>{window.__tk=Date.now();tick();},1000);requestAnimationFrame(render);
(function(){const b=document.getElementById('boot');const lines=['RDR  v8.7','','GPS ........ '+(loc.anyAt?'OK':'WAIT'),'CAMS ....... '+cams.length,'FLASH ZONES  '+flashes.length,'ROADS ...... '+(roads?'CACHED':'NONE'),'FACES ...... '+LOOKS.length,'ALERTS ..... '+(settings.sound?'SND ':'')+(settings.haptic?'HAP ':'')+(settings.voice?'VOX':''),'','READY'];let i=0;const iv=setInterval(()=>{b.textContent+=lines[i]+'\n';i++;if(i>=lines.length){clearInterval(iv);setTimeout(()=>b.style.display='none',450);}},150);b.addEventListener('pointerdown',()=>{clearInterval(iv);b.style.display='none';});})();
if(!window.NO_BUNDLE){loadScript('data/cams.js');loadScript('data/emirates.js');loadScript('data/roads/index.js');}
setTimeout(()=>{if(cams.length===0||Date.now()-settings.osmPull>30*24*3600*1000)refreshCams(true);},8000);
